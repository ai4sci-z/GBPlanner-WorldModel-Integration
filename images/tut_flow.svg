<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="820" height="560" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">实跑流程总览(照着走)</text>

  <!-- step boxes -->
  <g font-size="14" fill="#1f2937">
    <rect x="280" y="56" width="260" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="410" y="84" text-anchor="middle">① 开始菜单搜 <tspan font-family="monospace" font-weight="bold">Ubuntu</tspan> → 打开终端</text>

    <rect x="280" y="128" width="260" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="410" y="150" text-anchor="middle">② 敲 <tspan font-family="monospace" font-weight="bold">docker images | grep navlab</tspan></text>
    <text x="410" y="167" text-anchor="middle" font-size="11.5" fill="#6b7280">看镜像齐不齐(预研B需1个 / world-model需9个)</text>
  </g>

  <!-- branch -->
  <line x1="410" y1="174" x2="410" y2="200" stroke="#9ca3af" stroke-width="2"/>
  <line x1="200" y1="200" x2="620" y2="200" stroke="#9ca3af" stroke-width="2"/>
  <line x1="200" y1="200" x2="200" y2="224" stroke="#9ca3af" stroke-width="2"/>
  <line x1="620" y1="200" x2="620" y2="224" stroke="#9ca3af" stroke-width="2"/>

  <!-- route A -->
  <rect x="60" y="224" width="280" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">路线A:GBPlanner 仿真(现在就能跑)</text>
  <text x="200" y="270" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#166534">cd ~/gbplanner_ref</text>
  <text x="200" y="290" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#166534">bash build_and_run.sh</text>
  <text x="200" y="308" text-anchor="middle" font-size="11" fill="#6b7280">镜像 gbplanner-ref 已就绪</text>

  <!-- route B -->
  <rect x="480" y="224" width="280" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">路线B:world-model 探索(9镜像齐后)</text>
  <text x="620" y="270" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#1e40af">cd ~/ws/world-model</text>
  <text x="620" y="290" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#1e40af">navlab-sim run exploration</text>
  <text x="620" y="308" text-anchor="middle" font-size="11" fill="#6b7280">看现有 frontier_lite 探索</text>

  <!-- merge -->
  <line x1="200" y1="316" x2="200" y2="344" stroke="#9ca3af" stroke-width="2"/>
  <line x1="620" y1="316" x2="620" y2="344" stroke="#9ca3af" stroke-width="2"/>
  <line x1="200" y1="344" x2="620" y2="344" stroke="#9ca3af" stroke-width="2"/>
  <line x1="410" y1="344" x2="410" y2="370" stroke="#9ca3af" stroke-width="2"/>

  <rect x="270" y="370" width="280" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="410" y="398" text-anchor="middle" font-size="14" fill="#9a3412">③ 桌面弹出 <tspan font-weight="bold">Gazebo + RViz</tspan> 窗口</text>

  <line x1="410" y1="416" x2="410" y2="442" stroke="#9ca3af" stroke-width="2"/>
  <rect x="270" y="442" width="280" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="410" y="470" text-anchor="middle" font-size="14" fill="#9a3412">④ 看无人机自主探索建图</text>

  <line x1="410" y1="488" x2="410" y2="510" stroke="#9ca3af" stroke-width="2"/>
  <rect x="290" y="510" width="240" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="535" text-anchor="middle" font-size="13.5" fill="#991b1b">⑤ 按 <tspan font-family="monospace" font-weight="bold">Win+Shift+S</tspan> 截图存档</text>
</svg>

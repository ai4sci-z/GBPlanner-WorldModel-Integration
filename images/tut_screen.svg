<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">启动后桌面会弹出这两个窗口(示意,非实拍)</text>

  <!-- Gazebo window -->
  <rect x="30" y="56" width="380" height="320" rx="8" fill="#1f2937" stroke="#111827" stroke-width="2"/>
  <rect x="30" y="56" width="380" height="28" rx="8" fill="#374151"/>
  <text x="46" y="75" font-size="13" fill="#e5e7eb">● Gazebo —— 3D 虚拟世界(物理仿真)</text>
  <!-- ground -->
  <rect x="50" y="280" width="340" height="76" fill="#4b5563"/>
  <!-- walls (maze) -->
  <rect x="90" y="150" width="18" height="130" fill="#6b7280"/>
  <rect x="300" y="120" width="18" height="160" fill="#6b7280"/>
  <rect x="180" y="200" width="120" height="16" fill="#6b7280"/>
  <!-- drone -->
  <g transform="translate(160,235)">
    <line x1="-18" y1="-12" x2="18" y2="12" stroke="#9ca3af" stroke-width="3"/>
    <line x1="-18" y1="12" x2="18" y2="-12" stroke="#9ca3af" stroke-width="3"/>
    <circle cx="-18" cy="-12" r="6" fill="#ef4444"/><circle cx="18" cy="-12" r="6" fill="#ef4444"/>
    <circle cx="-18" cy="12" r="6" fill="#ef4444"/><circle cx="18" cy="12" r="6" fill="#ef4444"/>
    <rect x="-7" y="-6" width="14" height="12" rx="2" fill="#d1d5db"/>
  </g>
  <text x="160" y="270" text-anchor="middle" font-size="11" fill="#fca5a5">无人机</text>
  <text x="220" y="368" text-anchor="middle" font-size="11.5" fill="#9ca3af">迷宫/障碍 + 无人机在里面飞</text>

  <!-- RViz window -->
  <rect x="450" y="56" width="380" height="320" rx="8" fill="#111827" stroke="#0b1220" stroke-width="2"/>
  <rect x="450" y="56" width="380" height="28" rx="8" fill="#374151"/>
  <text x="466" y="75" font-size="13" fill="#e5e7eb">● RViz —— 算法可视化(它"脑子"里在想啥)</text>
  <!-- grid map -->
  <g stroke="#1f3a5f" stroke-width="1">
    <line x1="470" y1="100" x2="810" y2="100"/><line x1="470" y1="140" x2="810" y2="140"/>
    <line x1="470" y1="180" x2="810" y2="180"/><line x1="470" y1="220" x2="810" y2="220"/>
    <line x1="470" y1="260" x2="810" y2="260"/><line x1="470" y1="300" x2="810" y2="300"/><line x1="470" y1="340" x2="810" y2="340"/>
    <line x1="510" y1="96" x2="510" y2="356"/><line x1="560" y1="96" x2="560" y2="356"/><line x1="610" y1="96" x2="610" y2="356"/>
    <line x1="660" y1="96" x2="660" y2="356"/><line x1="710" y1="96" x2="710" y2="356"/><line x1="760" y1="96" x2="760" y2="356"/>
  </g>
  <!-- known/free area -->
  <rect x="520" y="180" width="180" height="120" fill="#0ea5e9" opacity="0.18"/>
  <!-- path + waypoints -->
  <polyline points="560,300 600,260 660,230 700,190" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="560" cy="300" r="5" fill="#22c55e"/><circle cx="600" cy="260" r="5" fill="#22c55e"/>
  <circle cx="660" cy="230" r="5" fill="#22c55e"/><circle cx="700" cy="190" r="6" fill="#facc15"/>
  <!-- drone pos -->
  <circle cx="560" cy="300" r="7" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="640" y="332" text-anchor="middle" font-size="11.5" fill="#93c5fd">蓝=已探索  绿线=规划路径  黄点=下一个目标</text>
  <text x="640" y="350" text-anchor="middle" font-size="11" fill="#9ca3af">看着地图一点点被探开、航点不断更新</text>
</svg>

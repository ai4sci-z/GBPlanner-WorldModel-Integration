<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="780" height="430" fill="#ffffff"/>
  <text x="390" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">集成策略:GBPlanner(ROS1) 接入 world-model(ROS2)的两条路</text>

  <!-- GBPlanner ROS1 box -->
  <rect x="280" y="56" width="220" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="390" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">GBPlanner(本体)</text>
  <text x="390" y="104" text-anchor="middle" font-size="12" fill="#991b1b">ROS1 · catkin · voxblox · 已证实</text>

  <!-- world-model ROS2 box -->
  <rect x="280" y="330" width="220" height="64" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">world-model 平台</text>
  <text x="390" y="378" text-anchor="middle" font-size="12" fill="#1e40af">ROS2 Humble · exploration 任务</text>

  <!-- Strategy A (left) -->
  <rect x="60" y="170" width="280" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="194" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">策略 A:ros1_bridge 桥接</text>
  <text x="200" y="218" text-anchor="middle" font-size="12" fill="#166534">原版 GBPlanner 不改,跑 ROS1 容器</text>
  <text x="200" y="238" text-anchor="middle" font-size="12" fill="#166534">用 ros1_bridge 把话题转给 ROS2</text>
  <text x="200" y="262" text-anchor="middle" font-size="11.5" fill="#16a34a">✓ 作者官方做法(Unified Autonomy Stack)</text>
  <text x="200" y="280" text-anchor="middle" font-size="11.5" fill="#16a34a">✓ 复用 voxblox,快;✗ 多一座桥/两套 ROS</text>

  <!-- Strategy B (right) -->
  <rect x="440" y="170" width="280" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="580" y="194" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">策略 B:抽核心 + ROS2 重写</text>
  <text x="580" y="218" text-anchor="middle" font-size="12" fill="#1e3a8a">抽 gbplanner_core(纯 C++,无框架)</text>
  <text x="580" y="238" text-anchor="middle" font-size="12" fill="#1e3a8a">+ ROS2 外壳 + 换 octomap/nvblox</text>
  <text x="580" y="262" text-anchor="middle" font-size="11.5" fill="#2563eb">✓ 单一 ROS2 栈,干净长远</text>
  <text x="580" y="280" text-anchor="middle" font-size="11.5" fill="#2563eb">✓ P1 已起步;✗ 工作量大,要重写建图</text>

  <!-- arrows -->
  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#ag)">
    <path d="M300,120 Q150,140 200,170"/>
    <path d="M200,290 Q150,320 300,346"/>
  </g>
  <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#ab)">
    <path d="M480,120 Q630,140 580,170"/>
    <path d="M580,290 Q630,320 480,346"/>
  </g>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>

  <text x="390" y="420" text-anchor="middle" font-size="13" fill="#b45309">待决策:A 快但要维护桥,B 干净但工作量大 —— 你这一问挖出了 A 这条官方捷径</text>
</svg>
